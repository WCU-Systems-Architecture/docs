name: Deploy Data Strategy Site

on:
  push:
    branches:
      - main  # Change this to 'master' if your repo uses the old default

permissions:
  contents: write  # Required for pushing the compiled HTML to the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache

      - name: Install MkDocs and Material Theme
        run: |
          pip install mkdocs-material

      - name: Deploy to GitHub Pages
        run: |
          mkdocs gh-deploy --force

